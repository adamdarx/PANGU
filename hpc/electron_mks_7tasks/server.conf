# Extract this package beside PANGU. The build directory is always build-electron-mks.
if [[ -f "$BUNDLE/../../src/pangu.h" ]]; then
  REPO="${REPO:-$BUNDLE/../..}"
else
  REPO="${REPO:-$BUNDLE/../PANGU}"
fi
PARTITION=GPU80G
QOS=low
WALL_HOURS=120
POLL_SECONDS=60
MAX_NO_PROGRESS_RESTARTS=3
PYTHON=python3
BUILD_JOBS=3
GPU_ARCH=AMPERE80
MPI_LAUNCH=(mpirun -np 2 --mca pml ucx --mca btl ^openib --mca coll ^hcoll)
load_environment() {
  module load gcc/12.2.0
  module load cuda/12.6.0
  module load cmake/3.31.9
  export OMP_NUM_THREADS=1
  # Load site-specific matching MPI/HDF5 modules here only if needed.
}
