# Isolated WM2 CUDA build: CarpetX + SpacetimeX/Z4c + AsterX.
VERSION = 2026-11-17-compatible-ci-cxx20
CPP = cpp
CC = gcc
CXX = g++
CUCC = nvcc
FPP = cpp
F90 = gfortran
LD = nvcc --compiler-bindir g++ --forward-unknown-to-host-compiler --relocatable-device-code=true --objdir-as-tempdir
CPPFLAGS = -DSIMD_CPU
FPPFLAGS = -traditional
CFLAGS = -g -std=gnu99
CXXFLAGS = -g -std=c++20 -D_GNU_SOURCE
CUCCFLAGS = --compiler-bindir g++ -x cu -g -std=c++20 -D_GNU_SOURCE --expt-relaxed-constexpr --extended-lambda --forward-unknown-to-host-compiler --Werror cross-execution-space-call --Werror ext-lambda-captures-this --relocatable-device-code=true --objdir-as-tempdir -arch=sm_80
F90FLAGS = -g -fcray-pointer -ffixed-line-length-none
LDFLAGS = -rdynamic -L/lustre/software/cuda/12.6.0/lib64 -Wl,-rpath,/lustre/home/2601110206/openmpi/lib -Wl,-rpath,/lustre/home/2601110206/hdf5/lib
LIBS = gfortran nvToolsExt curand
DEBUG = no
OPTIMISE = yes
C_OPTIMISE_FLAGS = -O2
CXX_OPTIMISE_FLAGS = -O2
CUCC_OPTIMISE_FLAGS = -O2
F90_OPTIMISE_FLAGS = -O2
PROFILE = no
WARN = yes
C_WARN_FLAGS = -Wall
CXX_WARN_FLAGS = -Wall
CUCC_WARN_FLAGS = -Wall
F90_WARN_FLAGS = -Wall
OPENMP = yes
CPP_OPENMP_FLAGS = -fopenmp
FPP_OPENMP_FLAGS = -D_OPENMP
C_OPENMP_FLAGS = -fopenmp
CXX_OPENMP_FLAGS = -fopenmp
CUCC_OPENMP_FLAGS = -fopenmp
F90_OPENMP_FLAGS = -fopenmp
LD_OPENMP_FLAGS = -fopenmp
DISABLE_INT16 = yes
DISABLE_REAL16 = yes
VECTORISE = no
PTHREADS_DIR = NO_BUILD
MPI_DIR = /lustre/home/2601110206/openmpi
HDF5_DIR = /lustre/home/2601110206/hdf5
HDF5_ENABLE_CXX = no
HDF5_ENABLE_FORTRAN = no
BOOST_DIR = /lustre/software/boost/1.83.0
GSL_DIR = /lustre/software/gsl/2.7.0/gcc_8.5.0
FFTW3_DIR = /lustre/software/fftw/3.3.10/gcc_8.5.0
BLAS_DIR = /lustre/software/OpenBLAS/OpenBLAS-0.3.33
BLAS_LIBS = openblas
LAPACK_DIR = /lustre/software/OpenBLAS/OpenBLAS-0.3.33
LAPACK_LIBS = openblas
AMREX_DIR = BUILD
AMREX_ENABLE_FORTRAN = no
AMREX_ENABLE_CUDA = yes
AMREX_CMAKE_CUDA_ARCHITECTURES = 80
NSIMD_DIR = BUILD
NSIMD_SIMD = CPU
YAML_CPP_DIR = BUILD
ZLIB_DIR = /usr
